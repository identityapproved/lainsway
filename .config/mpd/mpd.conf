# mpd for rmpc. Audio goes out through PipeWire, same as mpv.
# mpd reads this before /etc/mpd.conf when run as the user.

music_directory     "/mnt/music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
state_file          "~/.local/share/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"
log_file            "~/.local/state/mpd.log"
pid_file            "~/.local/state/mpd.pid"

# Local only; rmpc talks to it over 127.0.0.1:6600.
bind_to_address     "127.0.0.1"
port                "6600"

auto_update         "yes"
restore_paused      "yes"

# PipeWire native output. Do not add a pulse output as well - two outputs
# means mpd plays into both and you get doubled audio.
audio_output {
    type    "pipewire"
    name    "PipeWire"
}

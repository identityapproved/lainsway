<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- From lainland/fontconfig/fonts.conf. The monospace prefer-list leads with
     IosevkaTermSlab Nerd Font Mono: lainland's plain "Iosevka" is not installed
     on this host and fc-match falls it back to DejaVu Sans. -->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>IosevkaTermSlab Nerd Font Mono</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Color Emoji</family>
      <family>Unifont</family>
    </prefer>
  </alias>
</fontconfig>
